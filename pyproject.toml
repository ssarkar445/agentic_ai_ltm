[project]
name = "agentic-ai-ltm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Suman Sarkar", email = "ssarkar445@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
agentic-ai-ltm = "agentic_ai_ltm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
